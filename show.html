<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReLEAF · Slides</title>
<meta name="description" content="The GEMS Taiwan ReLEAF five-minute judging presentation, nine slides.">
<link rel="stylesheet" href="assets/deck.css?v=4">
<style>
html,body{height:100%;overflow:hidden;background:#f2f2ef}
.deck{position:fixed;inset:0;display:grid;place-items:center}
.frame{position:relative;background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.05),0 36px 90px -40px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .34s var(--ease),visibility 0s linear .34s}
.slide.on{opacity:1;visibility:visible;transition:opacity .34s var(--ease),visibility 0s}
.slide .stage{transform-origin:0 0}

/* chrome */
.bar{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(29,29,27,.08);z-index:20}
.bar i{display:block;height:100%;background:var(--olive);width:0;
  transition:width .34s var(--ease)}
.chr{position:fixed;z-index:21;opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
.chr.show{opacity:1;pointer-events:auto}

.topbar{left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:18px;padding:0 22px}
.topbar .where{font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.topbar .where b{color:var(--ink);font-weight:700}
.topbar .vsw{margin-left:auto;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}

.hud{display:flex;align-items:center;gap:14px;
  left:50%;bottom:26px;transform:translateX(-50%);
  padding:8px 10px 8px 16px;border-radius:980px;
  background:rgba(255,255,255,.82);border:1px solid var(--line-2);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 10px 30px -14px rgba(0,0,0,.3)}
.hud .ct{font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;
  letter-spacing:.02em}
.hud .tm{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
  padding-left:14px;border-left:1px solid var(--line)}
.hud button{width:30px;height:30px;border-radius:50%;border:0;background:var(--bg-2);
  color:var(--ink);font-size:14px;cursor:pointer;display:grid;place-items:center;
  transition:background .18s var(--ease)}
.hud button:hover{background:#e8e8e2}
.dots{left:50%;bottom:72px;transform:translateX(-50%);display:flex;gap:7px}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(29,29,27,.2);cursor:pointer;
  transition:background .2s var(--ease),transform .2s var(--ease)}
.dots b.on{background:var(--olive);transform:scale(1.35)}
</style>
</head>
<body>

<div class="deck"><div class="frame" id="frame"></div></div>

<div class="chr topbar" id="topbar">
  <span class="where" id="where"></span>
  <div id="vsw"></div>
</div>
<div class="chr dots" id="dots"></div>
<div class="chr hud" id="hud">
  <span class="ct" id="ct">01 / 09</span>
  <span class="tm" id="tm">0:00</span>
  <button id="prev" title="Previous">&#8249;</button>
  <button id="next" title="Next">&#8250;</button>
  <button id="full" title="Full screen">&#9633;</button>
</div>
<div class="bar"><i id="barI"></i></div>

<script src="assets/nav.js?v=4"></script>
<script src="assets/deck.js?v=4"></script>
<script>
document.getElementById('vsw').innerHTML = viewSwitcher('slides');

const frame = document.getElementById('frame');
frame.innerHTML = SLIDES.map((s,i) =>
  `<div class="slide" data-i="${i}"><div class="stage">${s.stage}</div></div>`).join('');
const slides = [...frame.querySelectorAll('.slide')];
const dots = document.getElementById('dots');
dots.innerHTML = SLIDES.map((s,i)=>`<b data-i="${i}" title="${s.title}"></b>`).join('');
const dotEls = [...dots.querySelectorAll('b')];

let cur = 0;

function fit(){
  const pad = 56;
  const w = innerWidth - pad*2, h = innerHeight - pad*2;
  const s = Math.min(w/1600, h/900);
  frame.style.width = (1600*s)+'px';
  frame.style.height = (900*s)+'px';
  frame.querySelectorAll('.stage').forEach(st => st.style.transform = `scale(${s})`);
}
addEventListener('resize', fit); fit();

function go(i, instant){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  if (i === cur && !instant) { return; }
  slides[cur].classList.remove('on');
  cur = i;
  const el = slides[cur];
  el.classList.add('on');
  /* restart the entrance steps each time the slide is shown */
  const st = el.querySelector('.stage');
  st.classList.remove('go');
  void st.offsetWidth;
  st.classList.add('go');
  dotEls.forEach((d,k)=> d.classList.toggle('on', k===cur));
  document.getElementById('ct').textContent =
    String(cur+1).padStart(2,'0') + ' / ' + String(SLIDES.length).padStart(2,'0');
  document.getElementById('where').innerHTML =
    `<b>${SLIDES[cur].title}</b> &nbsp;·&nbsp; ${SLIDES[cur].nav}`;
  document.getElementById('barI').style.width =
    ((cur+1)/SLIDES.length*100) + '%';
  location.hash = cur+1;
}

addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)) { e.preventDefault(); go(cur+1); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); go(cur-1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(SLIDES.length-1);
  else if (e.key === 'f') toggleFull();
  else if (e.key === 't') toggleTimer();
  else if (e.key === 'Escape') location.href = 'index.html';
  else if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
});
document.getElementById('next').onclick = ()=> go(cur+1);
document.getElementById('prev').onclick = ()=> go(cur-1);
document.getElementById('full').onclick = toggleFull;
dotEls.forEach(d => d.onclick = ()=> go(+d.dataset.i));
frame.addEventListener('click', e => {
  go(e.clientX < innerWidth/2 ? cur-1 : cur+1);
});

function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

/* presentation clock: starts on the first advance, t resets it */
let t0 = null, tick = null;
const tm = document.getElementById('tm');
function startClock(){
  if (t0) return;
  t0 = Date.now();
  tick = setInterval(()=>{
    const s = Math.floor((Date.now()-t0)/1000);
    tm.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    tm.style.color = s > 300 ? '#a33' : '';
  }, 250);
}
function toggleTimer(){
  if (tick) { clearInterval(tick); tick = null; t0 = null; tm.textContent = '0:00'; tm.style.color=''; }
  else startClock();
}
['next','prev'].forEach(id => document.getElementById(id).addEventListener('click', startClock));
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') startClock(); });

/* chrome fades out while idle */
const chrome = [...document.querySelectorAll('.chr')];
let idle;
function wake(){
  chrome.forEach(c => c.classList.add('show'));
  clearTimeout(idle);
  idle = setTimeout(()=> chrome.forEach(c => c.classList.remove('show')), 2600);
}
['mousemove','keydown','click','touchstart'].forEach(ev => addEventListener(ev, wake));
wake();

/* touch */
let tx = null;
addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 48) go(dx < 0 ? cur+1 : cur-1);
  tx = null;
}, {passive:true});

const hashIndex = () => {
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) && n >= 1 ? n-1 : 0;
};
addEventListener('hashchange', ()=> { if (hashIndex() !== cur) go(hashIndex()); });
go(hashIndex(), true);
</script>
</body>
</html>
