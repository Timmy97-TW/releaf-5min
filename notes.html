<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReLEAF · Slides + script</title>
<meta name="description" content="The GEMS Taiwan ReLEAF five-minute judging presentation, one slide at a time with its speaking script and who says it.">
<link rel="stylesheet" href="assets/deck.css?v=13">
<style>
html,body{height:100%;overflow:hidden;background:#f2f2ef}
.lay{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}

/* ---- left: the slide ---- */
.left{position:relative;display:grid;place-items:center;padding:60px 40px 76px;min-width:0}
.frame{position:relative;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.05),0 30px 70px -36px rgba(0,0,0,.42)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .3s var(--ease),visibility 0s linear .3s}
.slide.on{opacity:1;visibility:visible;transition:opacity .3s var(--ease),visibility 0s}
.slide .stage{transform-origin:0 0}

/* ---- right: the script ---- */
.right{background:#fff;border-left:1px solid var(--line);overflow-y:auto;
  padding:30px 34px 40px;display:flex;flex-direction:column}
.who{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.who b{font-size:19px;font-weight:750;letter-spacing:-.015em}
.who .n{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.who .t{margin-left:auto;font-size:13px;font-weight:650;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.hand{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:#fff;background:var(--olive-d);padding:3px 8px;border-radius:5px}
.clm{margin:0 0 18px;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.22}
.clm em{font-style:normal;color:var(--olive-d)}
.rkick{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--olive);margin:0 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.lead{font-size:20px;line-height:1.34;letter-spacing:-.015em;font-weight:650;margin:0 0 16px}
.right p.b{font-size:16px;line-height:1.56;color:var(--ink-2);margin:0 0 13px}
.nums{margin:22px 0 0;border-top:1px solid var(--line);padding-top:4px}
.nums div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;
  border-bottom:1px solid var(--line-2)}
.nums dt{font-size:14px;color:var(--ink-2)}
.nums dd{margin:0;font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.careful{margin:22px 0 0;padding:15px 16px;border-radius:13px;background:var(--bg-2)}
.careful h4{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--olive-d)}
.careful p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2)}

/* ---- chrome ---- */
.topbar{position:fixed;left:0;top:0;height:54px;display:flex;align-items:center;
  gap:16px;padding:0 24px;z-index:20;right:430px}
.topbar .vsw{margin-left:auto}
.hud{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:21;
  display:flex;align-items:center;gap:12px;padding:7px 9px 7px 15px;border-radius:980px;
  background:rgba(255,255,255,.88);border:1px solid var(--line-2);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 10px 28px -14px rgba(0,0,0,.3)}
.hud .ct{font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hud .tm{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
  padding-left:12px;border-left:1px solid var(--line)}
.hud button{width:29px;height:29px;border-radius:50%;border:0;background:var(--bg-2);
  color:var(--ink);font-size:14px;cursor:pointer;display:grid;place-items:center}
.hud button:hover{background:#e8e8e2}

@media (max-width:1100px){
  .lay{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .left{padding:54px 20px 16px}
  .right{border-left:0;border-top:1px solid var(--line)}
  .topbar{right:0}
}
</style>
</head>
<body>

<div class="lay">
  <div class="left"><div class="frame" id="frame"></div></div>
  <div class="right" id="right"></div>
</div>

<div class="topbar"><div id="vsw"></div></div>
<div class="hud">
  <span class="ct" id="ct">01 / 10</span>
  <span class="tm" id="tm">0:00</span>
  <button id="prev" title="Previous">&#8249;</button>
  <button id="next" title="Next">&#8250;</button>
</div>

<script src="assets/nav.js?v=13"></script>
<script src="assets/deck.js?v=13"></script>
<script>
document.getElementById('vsw').innerHTML = viewSwitcher('notes');

const frame = document.getElementById('frame');
const right = document.getElementById('right');
frame.innerHTML = SLIDES.map((s,i) =>
  `<div class="slide" data-i="${i}"><div class="stage go">${stageHTML(SLIDES,i)}</div></div>`).join('');
const slides = [...frame.querySelectorAll('.slide')];
const planTotal = SLIDES.reduce((a,s)=>a+s.secs,0);
let cur = 0;

function fit(){
  const box = document.querySelector('.left');
  const w = box.clientWidth - 80, h = box.clientHeight - 136;
  const s = Math.max(.1, Math.min(w/1600, h/900));
  frame.style.width = (1600*s)+'px';
  frame.style.height = (900*s)+'px';
  frame.querySelectorAll('.stage').forEach(st => st.style.transform = `scale(${s})`);
}
addEventListener('resize', fit);

/* the script panel, rebuilt for the slide on screen */
function panel(i){
  const s = SLIDES[i];
  const handover = i === 0 || SLIDES[i-1].speaker !== s.speaker;
  const sc = s.script;
  right.innerHTML =
    `<div class="who">
       <span class="n">Slide ${String(s.n).padStart(2,'0')}</span>
       <b>${s.speaker}</b>
       ${handover ? '<span class="hand">takes over</span>' : ''}
       <span class="t">${s.time} · ${s.secs}s</span>
     </div>
     <p class="clm">${s.title}</p>
     <p class="rkick">${s.speaker} says</p>
     <p class="lead">${sc.lead}</p>
     ${sc.body.map(p => `<p class="b">${p}</p>`).join('')}
     ${sc.numbers.length ? `<dl class="nums">${sc.numbers.map(([k,v]) =>
        `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
     ${sc.careful ? `<div class="careful"><h4>If pressed</h4><p>${sc.careful}</p></div>` : ''}`;
  right.scrollTop = 0;
}

function go(i, instant){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  if (i === cur && !instant) return;
  slides[cur].classList.remove('on');
  cur = i;
  slides[cur].classList.add('on');
  panel(cur);
  document.getElementById('ct').textContent =
    String(cur+1).padStart(2,'0') + ' / ' + String(SLIDES.length).padStart(2,'0');
  location.hash = cur+1;
}

addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)) { e.preventDefault(); go(cur+1); startClock(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); go(cur-1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(SLIDES.length-1);
  else if (e.key === 't') toggleTimer();
  else if (e.key === 'Escape') location.href = 'index.html';
  else if (/^[0-9]$/.test(e.key)) go(e.key === '0' ? 9 : +e.key - 1);
});
document.getElementById('next').onclick = ()=> { go(cur+1); startClock(); };
document.getElementById('prev').onclick = ()=> go(cur-1);
frame.addEventListener('click', e => {
  go(e.clientX < frame.getBoundingClientRect().left + frame.clientWidth/2 ? cur-1 : cur+1);
});

/* the pace caret on each slide's progress rail */
function paintCaret(sec){
  frame.querySelectorAll('.nodebar').forEach(bar => {
    const c = bar.querySelector('.caret');
    if (!c) return;
    const due = +bar.dataset.at + SLIDES[+bar.dataset.slide].secs;
    c.classList.add('on');
    c.style.left = Math.min(100, sec / (+bar.dataset.total) * 100) + '%';
    c.classList.toggle('late', sec > due + 4);
  });
}

let t0 = null, tick = null;
const tm = document.getElementById('tm');
function startClock(){
  if (t0) return;
  t0 = Date.now();
  tick = setInterval(()=>{
    const s = Math.floor((Date.now()-t0)/1000);
    tm.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    tm.style.color = s > planTotal ? '#a33' : '';
    paintCaret(s);
  }, 250);
}
function toggleTimer(){
  if (tick) { clearInterval(tick); tick = null; t0 = null; tm.textContent='0:00'; tm.style.color=''; }
  else startClock();
}

const hashIndex = () => {
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) && n >= 1 ? n-1 : 0;
};
addEventListener('hashchange', ()=> { if (hashIndex() !== cur) go(hashIndex()); });
go(hashIndex(), true);
fit();
addEventListener('load', fit);
</script>
</body>
</html>
